name: software-development-v1
label: 软件开发标准流程
version: "1.0"
description: 标准的 6 阶段软件开发与评审流程 (需求分析 -> 计划 -> 实现 -> 测试 -> 评审 -> 收尾)

nodes:
  - id: requirements
    label: 2需求分析
    node_type: agent
    depends_on: []
    purpose: 理解需求、澄清范围、识别约束、形成可验收需求。
    default_integration_mode: none
    default_task_type: docs
    agent_policy:
      preferred: [claude, qodercli, opencode, codex, agy, pi]
    required_outputs:
      - 需求目标
      - 功能范围
      - 非目标与边界
      - 业务规则
      - 关键约束
      - 风险与待确认事项
      - 明确验收标准
    rules:
      - 以分析和方案输出为主
      - 默认不得修改业务代码
      - 不得直接进入实现阶段
      - 仅当 workflow_id 以 e2e- 开头时：验收不得依赖 Pane/TUI 是否能读到完成文本；Task 的 acceptance criteria 必须以 Herdr 生命周期到达 done/agent_done 且 verify-baseline 返回 BASELINE_MATCH 为完成依据；不得要求 E2E_*_OK 或 HERDR_TASK_DONE 必须能通过 pane read 读取；满足上述条件直接 completed，不要因为 alternate-screen 空白而 rework。
      - 创建 Task 时默认使用 --agent auto，由 Agent Router 根据当前 node、task_type 和项目 Agent Pool 动态选择；只有存在明确理由或用户显式指定时才固定具体 Agent。
      - 同一阶段允许多个 Task 使用不同 Agent 并行协作，不得默认把所有 Task 固定给同一个 Agent。

  - id: plan
    label: 3计划
    node_type: agent
    depends_on: [requirements]
    purpose: 把已确认需求转化为可并行执行、可验收的工程任务。
    default_integration_mode: none
    default_task_type: docs
    agent_policy:
      preferred: [claude, qodercli, codex, opencode, agy, pi]
    required_outputs:
      - 实现方案
      - 任务拆分
      - 任务依赖
      - 每个 Task 的目标
      - 每个 Task 的验收标准
      - 风险与验证方案
    rules:
      - Task 按业务目标拆分，不按固定前端后端角色拆分
      - 允许规划多个并行 Task
      - 默认不得修改业务代码
      - 仅当 workflow_id 以 e2e- 开头时：验收不得依赖 Pane/TUI 是否能读到完成文本；Task 的 acceptance criteria 必须以 Herdr 生命周期到达 done/agent_done 且 verify-baseline 返回 BASELINE_MATCH 为完成依据；不得要求 E2E_*_OK 或 HERDR_TASK_DONE 必须能通过 pane read 读取；满足上述条件直接 completed，不要因为 alternate-screen 空白而 rework。
      - 创建 Task 时默认使用 --agent auto，由 Agent Router 根据当前 node、task_type 和项目 Agent Pool 动态选择；只有存在明确理由或用户显式指定时才固定具体 Agent。
      - 同一阶段允许多个 Task 使用不同 Agent 并行协作，不得默认把所有 Task 固定给同一个 Agent。

  - id: implementation
    label: 4实现
    node_type: agent
    depends_on: [plan]
    parallel: true
    purpose: 按照计划完成真实代码实现。
    default_integration_mode: git
    default_task_type: feat
    agent_policy:
      preferred: [opencode, codex, qodercli, agy, claude, pi]
      parallel: true
      max_agents: 3
    required_outputs:
      - 代码实现
      - 修改文件说明
      - 必要测试
      - 风险说明
    rules:
      - 严格按照 Task 定义的范围执行
      - 必须保证修改仅局限于 Task 目标内
      - 提交前必须自测
      - 确保修改与验收标准一致
      - 仅当 workflow_id 以 e2e- 开头时：验收不得依赖 Pane/TUI 是否能读到完成文本；Task 的 acceptance criteria 必须以 Herdr 生命周期到达 done/agent_done 且 verify-baseline 返回 BASELINE_MATCH 为完成依据；不得要求 E2E_*_OK 或 HERDR_TASK_DONE 必须能通过 pane read 读取；满足上述条件直接 completed，不要因为 alternate-screen 空白而 rework。
      - 创建 Task 时默认使用 --agent auto，由 Agent Router 根据当前 node、task_type 和项目 Agent Pool 动态选择；只有存在明确理由或用户显式指定时才固定具体 Agent。
      - 同一阶段允许多个 Task 使用不同 Agent 并行协作，不得默认把所有 Task 固定给同一个 Agent。
      - 禁止使用普通 git status 判断修改范围，必须以 verify-baseline 为准。

  - id: test
    label: 5测试
    node_type: agent
    depends_on: [implementation]
    purpose: 验证实现结果是否满足需求与验收标准。
    default_integration_mode: none
    default_task_type: test
    agent_policy:
      preferred: [codex, opencode, qodercli, claude, agy, pi]
    required_outputs:
      - 测试执行记录
      - 缺陷清单
      - 回归测试结果
      - 边界条件验证情况
      - 测试结论（PASS / FAIL）
    rules:
      - 以验证为主，不得随意修改代码
      - 发现问题必须提报并指出明确缺陷
      - 必须覆盖计划阶段制定的验证方案
      - 仅当 workflow_id 以 e2e- 开头时：验收不得依赖 Pane/TUI 是否能读到完成文本；Task 的 acceptance criteria 必须以 Herdr 生命周期到达 done/agent_done 且 verify-baseline 返回 BASELINE_MATCH 为完成依据；不得要求 E2E_*_OK 或 HERDR_TASK_DONE 必须能通过 pane read 读取；满足上述条件直接 completed，不要因为 alternate-screen 空白而 rework。
      - 创建 Task 时默认使用 --agent auto，由 Agent Router 根据当前 node、task_type 和项目 Agent Pool 动态选择；只有存在明确理由或用户显式指定时才固定具体 Agent。
      - 同一阶段允许多个 Task 使用不同 Agent 并行协作，不得默认把所有 Task 固定给同一个 Agent。
      - 测试必须针对 Candidate 分支或隔离 Clone 进行验证。

  - id: review
    label: 6评审
    node_type: agent
    depends_on: [test]
    purpose: 对代码质量、架构、安全性和可维护性进行独立评审。
    default_integration_mode: none
    default_task_type: test
    agent_policy:
      preferred: [claude, codex, qodercli, opencode, agy, pi]
    required_outputs:
      - 代码规范审查结论
      - 架构合理性评估
      - 安全风险评估
      - 改进建议与结论
    rules:
      - 评审必须独立执行，评审者不得与实现者混淆
      - 重点检查范围蔓延、未处理异常和潜在性能缺陷
      - 结论必须明确（通过 / 需返工 / 拒绝）
      - 仅当 workflow_id 以 e2e- 开头时：验收不得依赖 Pane/TUI 是否能读到完成文本；Task 的 acceptance criteria 必须以 Herdr 生命周期到达 done/agent_done 且 verify-baseline 返回 BASELINE_MATCH 为完成依据；不得要求 E2E_*_OK 或 HERDR_TASK_DONE 必须能通过 pane read 读取；满足上述条件直接 completed，不要因为 alternate-screen 空白而 rework。
      - 创建 Task 时默认使用 --agent auto，由 Agent Router 根据当前 node、task_type 和项目 Agent Pool 动态选择；只有存在明确理由或用户显式指定时才固定具体 Agent。
      - 同一阶段允许多个 Task 使用不同 Agent 并行协作，不得默认把所有 Task 固定给同一个 Agent。
      - 评审未通过时触发返工流程。

  - id: wrapup
    label: 7收尾
    node_type: agent
    depends_on: [review]
    purpose: 确认整个 Workflow 完成，汇总成果、风险和交付信息。
    default_integration_mode: git
    default_task_type: docs
    agent_policy:
      preferred: [claude, qodercli, opencode, codex, agy, pi]
    required_outputs:
      - 最终交付成果说明
      - 修改文件清单
      - 合并/集成建议
      - 遗留问题与后续建议
      - 文档更新说明
      - 归档确认
      - 总结报告
    rules:
      - 必须核对全流程所有阶段的交付物是否完备
      - 负责生成交付汇总和合并指引
      - 仅当 workflow_id 以 e2e- 开头时：验收不得依赖 Pane/TUI 是否能读到完成文本；Task 的 acceptance criteria 必须以 Herdr 生命周期到达 done/agent_done 且 verify-baseline 返回 BASELINE_MATCH 为完成依据；不得要求 E2E_*_OK 或 HERDR_TASK_DONE 必须能通过 pane read 读取；满足上述条件直接 completed，不要因为 alternate-screen 空白而 rework。
      - 创建 Task 时默认使用 --agent auto，由 Agent Router 根据当前 node、task_type 和项目 Agent Pool 动态选择；只有存在明确理由或用户显式指定时才固定具体 Agent。
      - 同一阶段允许多个 Task 使用不同 Agent 并行协作，不得默认把所有 Task 固定给同一个 Agent。
      - 收尾完成后，标记整个 Workflow 进入完成状态。
      - 提醒用户执行物理 purge 或保留现场供复查。
